name: bench

# Manual only (Actions tab -> bench -> Run workflow; pick the branch there).
# Builds the bench programs (Release, static tblog) and runs them on GitHub's
# hosted runners:
#   bench/bench_vs_printf   tblog vs plain fprintf: throughput, per-call latency
#   bench/bench_crash_loss  log lines lost on crash / kill / exit
# With "compare" ticked, CMake also downloads spdlog and Quill
# (-DTBLOG_BENCH_COMPARE=ON) and the run adds:
#   bench/bench_vs_libs     tblog vs spdlog (async) vs Quill: throughput, latency
#   bench_crash_loss variants spdlog_async, quill, quill_sighandler
# The JSON results are uploaded as artifacts and rendered into the job
# summary by bench/report.py. Shared CI VMs are noisy: compare the variants
# within one runner, do not read the numbers as absolute figures
# (docs/benchmarks.md).
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'bench_vs_printf --runs (measured runs per cell)'
        default: '5'
      trials:
        description: 'bench_crash_loss --trials (trials per scenario and variant)'
        default: '20'
      quick:
        description: 'Smoke run only (--quick)'
        type: boolean
        default: false
      compare:
        description: 'Also compare with spdlog (async) and Quill (downloads both)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    name: bench / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Windows: the default Visual Studio generator (MSVC, multi-config).
      - name: Configure
        env:
          COMPARE: ${{ inputs.compare }}
        run: |
          cmp=OFF; if [ "$COMPARE" = true ]; then cmp=ON; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTBLOG_BUILD_BENCH=ON -DTBLOG_WITH_ZLIB=OFF \
            -DTBLOG_BENCH_COMPARE=$cmp

      - name: Build
        env:
          COMPARE: ${{ inputs.compare }}
        run: |
          targets="bench_vs_printf bench_crash_loss"
          if [ "$COMPARE" = true ]; then targets="$targets bench_vs_libs"; fi
          cmake --build build --config Release --parallel --target $targets

      - name: Run the benchmarks
        env:
          RUNS: ${{ inputs.runs }}
          TRIALS: ${{ inputs.trials }}
          QUICK: ${{ inputs.quick }}
          COMPARE: ${{ inputs.compare }}
        run: |
          set -eu
          bin=build/bench
          if [ -d build/bin/Release ]; then bin=build/bin/Release; fi   # Windows (MSVC)
          perf_opts="--runs $RUNS"; crash_opts="--trials $TRIALS"
          if [ "$QUICK" = true ]; then perf_opts=--quick; crash_opts=--quick; fi
          variants=fprintf_buffered,fprintf_flush,tblog,tblog_flush_error
          if [ "$COMPARE" = true ]; then variants="$variants,spdlog_async,quill,quill_sighandler"; fi
          info="CMake Release, $(cmake --version | head -n 1), GitHub-hosted $RUNNER_OS runner (${ImageOS:-?} ${ImageVersion:-?})"
          label="shared CI VM - noisy, for relative comparison"
          mkdir -p results
          "$bin/bench_vs_printf" $perf_opts --out-dir results \
            --commit "$GITHUB_SHA" --label "$label" --build-info "$info"
          if [ "$COMPARE" = true ]; then
            "$bin/bench_vs_libs" $perf_opts --out-dir results \
              --commit "$GITHUB_SHA" --label "$label" --build-info "$info"
          fi
          "$bin/bench_crash_loss" $crash_opts --variants "$variants" --out-dir results \
            --commit "$GITHUB_SHA" --label "$label" --build-info "$info"
          ls -l results

      - name: Job summary (bench/report.py)
        if: always()
        run: |
          {
            echo "> **shared CI VM — noisy, for relative comparison** between the variants of one runner;"
            echo "> not absolute figures. Method: docs/benchmarks.md."
            echo
            python -I bench/report.py --title "bench / $RUNNER_OS" results/*.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ matrix.os }}
          path: results/
          if-no-files-found: warn
