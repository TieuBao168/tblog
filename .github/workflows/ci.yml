name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Linux: the library is built and tested by cmake-linux (gcc / clang,
# C++11/17, sanitizers, no zlib), install, make and lite; cmake-linux also
# compiles tests/header_check via TBLOG_BUILD_TESTS=ON.
# Windows: cmake-windows builds the static library and the DLL, the tests,
# the examples, the DLL export check (packaging/check-exports.ps1) and, for
# MSVC, installs and builds packaging/consumer with find_package: MSVC x64
# (Release without zlib, Debug with vcpkg's zlib) and MinGW-w64 (MSYS2).
# The `headers` job compiles only the public headers
# (TBLOG_HEADERS_ONLY_CHECK=ON) where the library is not built yet: macOS
# (AppleClang; full `cmake-macos` job in roadmap step 6) and MSVC ARM64
# (cross-compiled, compile only).

jobs:
  # No OS headers / OS calls outside src/platform/ (the platform layer).
  platform-boundary:
    name: platform boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: packaging/check-platform-boundary.sh
        run: sh packaging/check-platform-boundary.sh src

  cmake-linux:
    name: cmake / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc / C++17 / RelWithDebInfo
            cc: gcc
            cxx: g++
            std: 17
            options: ''
          - name: gcc / C++11
            cc: gcc
            cxx: g++
            std: 11
            options: ''
          - name: clang / C++17
            cc: clang
            cxx: clang++
            std: 17
            options: ''
          - name: gcc / ASan+UBSan
            cc: gcc
            cxx: g++
            std: 17
            options: -DTBLOG_SANITIZE=address,undefined
          - name: gcc / TSan
            cc: gcc
            cxx: g++
            std: 17
            options: -DTBLOG_SANITIZE=thread
          - name: gcc / no zlib
            cc: gcc
            cxx: g++
            std: 17
            options: -DTBLOG_WITH_ZLIB=OFF
    env:
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev clang

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DTBLOG_CXX_STANDARD=${{ matrix.std }}
          -DTBLOG_BUILD_TESTS=ON
          -DTBLOG_BUILD_EXAMPLES=ON
          -DTBLOG_BUILD_BENCH=ON
          -DTBLOG_WERROR=ON
          ${{ matrix.options }}

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # Windows: static library + DLL, every test (tests/unit against the static
  # library, tests/shared against the DLL), the examples (as CTest smoke
  # tests, against the DLL) and check_exports (the DLL exports exactly the
  # TBLOG_API functions). The header check (tests/header_check) is compiled
  # at CMAKE_CXX_STANDARD, independently of the library's TBLOG_CXX_STANDARD.
  cmake-windows:
    name: cmake-windows / ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc x64 / Release / no zlib / install
            kind: msvc
            shell: pwsh
            config: Release
            options: -DTBLOG_WITH_ZLIB=OFF
            vcpkg: false
            install: true
          - name: msvc x64 / Debug / C++14 / zlib (vcpkg) / Werror
            kind: msvc
            shell: pwsh
            config: Debug
            options: -DTBLOG_WERROR=ON -DTBLOG_CXX_STANDARD=14 -DCMAKE_CXX_STANDARD=20
            vcpkg: true
            install: false
          - name: mingw-w64 gcc / Release / C++11 / zlib / Werror
            kind: mingw
            shell: msys2 {0}
            config: Release
            options: -DTBLOG_WERROR=ON -DTBLOG_CXX_STANDARD=11 -DCMAKE_CXX_STANDARD=20
            vcpkg: false
            install: false
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 MinGW-w64 toolchain
        if: matrix.kind == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib

      # Classic mode with the runner's preinstalled vcpkg.
      - name: Install zlib (vcpkg)
        if: matrix.vcpkg
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows'

      - name: Configure (MSVC)
        if: matrix.kind == 'msvc'
        run: |
          $extra = @()
          if ('${{ matrix.vcpkg }}' -eq 'true') {
            $extra += "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            $extra += "-DVCPKG_TARGET_TRIPLET=x64-windows"
          }
          cmake -S . -B build -A x64 -DTBLOG_BUILD_TESTS=ON -DTBLOG_BUILD_EXAMPLES=ON `
            -DTBLOG_BUILD_BENCH=ON ${{ matrix.options }} @extra | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.vcpkg }}' -eq 'true' -and
              -not (Select-String -Quiet -Path configure.log -Pattern '\(zlib\): ON')) {
            Write-Error "zlib from vcpkg was not found"; exit 1
          }

      - name: Configure (MinGW)
        if: matrix.kind == 'mingw'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DTBLOG_BUILD_TESTS=ON -DTBLOG_BUILD_EXAMPLES=ON -DTBLOG_BUILD_BENCH=ON
          ${{ matrix.options }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      # Also part of the Test step; run on its own so its output is in the log.
      - name: DLL export check
        run: ctest --test-dir build -C ${{ matrix.config }} -R check_exports -V

      # find_package(tblog 0.1) from a separate CMake project against the
      # installed tree: tblog::tblog (the DLL), tblog::tblog_static, cpp_api.
      - name: Install + find_package consumer (packaging/consumer)
        if: matrix.install
        run: |
          $prefix = "$env:RUNNER_TEMP/tblog"
          cmake --install build --config ${{ matrix.config }} --prefix $prefix
          if (-not (Test-Path "$prefix/lib/tblog_static.lib") -or -not (Test-Path "$prefix/lib/tblog.lib") -or
              -not (Test-Path "$prefix/bin/tblog.dll")) {
            Get-ChildItem -Recurse $prefix | Select-Object FullName; Write-Error "unexpected install layout"; exit 1
          }
          cmake -S packaging/consumer -B build-consumer -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-consumer --config ${{ matrix.config }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location build-consumer/${{ matrix.config }}
          function Run-Basic($exe) {
            Set-Content -Encoding ascii -Path "$exe.conf" -Value "file.path = $PWD/$exe.log`nreload.watch = false"
            & "./$exe.exe" "$exe.conf"
            if ($LASTEXITCODE -ne 0) { Write-Error "$exe exited with $LASTEXITCODE"; exit 1 }
            if (-not (Select-String -Quiet -Path "$exe.log" -Pattern 'started, pid-independent message hello')) {
              Write-Error "$exe.log: start line missing"; exit 1
            }
            $n = @(Select-String -Path "$exe.log" -Pattern 'worker . step').Count
            if ($n -ne 4000) { Write-Error "$exe.log: $n worker lines, expected 4000"; exit 1 }
          }
          Run-Basic basic_static              # needs no tblog.dll (not on PATH yet)
          $env:PATH = "$prefix/bin;$env:PATH"
          Run-Basic basic_default             # tblog::tblog -> tblog.dll
          Set-Content -Encoding ascii -Path cpp_api.conf -Value "file.path = $PWD/cpp_api.log`nreload.watch = false"
          ./cpp_api.exe cpp_api.conf 1000
          if ($LASTEXITCODE -ne 0) { Write-Error "cpp_api exited with $LASTEXITCODE"; exit 1 }
          if (-not (Select-String -Quiet -Path cpp_api.log -Pattern 'user 42 logged in from 10.0.0.7:8443')) {
            Write-Error "cpp_api.log: line missing"; exit 1
          }

  # Public headers only (tests/header_check, plain and with TBLOG_DLL): strict
  # warnings as errors (/W4 /WX /permissive-, or -Wall -Wextra -Wpedantic
  # -Werror), where the library itself is not built (yet).
  headers:
    name: headers / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-compiled, compile only: covers the ARM64 atomics in log.h.
          - name: msvc arm64 / C++17
            os: windows-latest
            kind: msvc
            shell: pwsh
            generator: -A ARM64
            std: 17
          - name: macos appleclang / C++11
            os: macos-latest
            kind: macos
            shell: bash
            generator: ''
            std: 11
          - name: macos appleclang / C++20
            os: macos-latest
            kind: macos
            shell: bash
            generator: ''
            std: 20
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # C++: CMAKE_CXX_STANDARD; C: C99 (C11 on MSVC), set in CMakeLists.txt.
      - name: Configure
        run: >
          cmake -S . -B build ${{ matrix.generator }}
          -DTBLOG_HEADERS_ONLY_CHECK=ON
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}

      - name: Build
        run: cmake --build build --config Release --verbose

  install:
    name: install / pkg-config + find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev pkg-config

      - name: Build and install
        run: |
          PREFIX="$RUNNER_TEMP/tblog"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib -DTBLOG_WERROR=ON
          cmake --build build
          cmake --install build

      # examples/basic.c against the installed tree via pkg-config, static and shared.
      - name: pkg-config consumer (packaging/check-install.sh)
        env:
          TBLOG_INSTALLED_PREFIX: ${{ runner.temp }}/tblog
          BUILD: build
          CC: gcc
          CFLAGS: -O2 -std=c99 -Wall -Wextra -Werror -pthread
          LDFLAGS: -pthread
        run: sh packaging/check-install.sh

      # find_package(tblog 0.1) + tblog::tblog from a separate CMake project.
      - name: find_package consumer (packaging/consumer)
        run: |
          PREFIX="$RUNNER_TEMP/tblog"
          cmake -S packaging/consumer -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH="$PREFIX"
          cmake --build build-consumer
          export LD_LIBRARY_PATH="$PREFIX/lib"
          cd build-consumer
          for exe in basic_default basic_static; do
            printf 'file.path = %s\nreload.watch = false\n' "$PWD/$exe.log" > "$exe.conf"
            "./$exe" "$exe.conf"
            grep -q 'started, pid-independent message hello' "$exe.log"
            n=$(grep -c 'worker . step' "$exe.log")
            test "$n" -eq 4000
          done
          readelf -d basic_default > basic_default.dyn
          grep -q 'NEEDED.*\[libtblog\.so\.0\]' basic_default.dyn
          readelf -d basic_static > basic_static.dyn
          if grep -q 'NEEDED.*libtblog' basic_static.dyn; then
            echo "basic_static depends on libtblog.so"; exit 1
          fi
          printf 'file.path = %s\nreload.watch = false\n' "$PWD/cpp_api.log" > cpp_api.conf
          ./cpp_api cpp_api.conf 1000
          grep -q 'user 42 logged in from 10.0.0.7:8443' cpp_api.log

  make:
    name: make / test + check-symbols + check-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev pkg-config

      - name: make test
        run: make -j"$(nproc)" test

      - name: make check-symbols
        run: make check-symbols

      - name: make check-install
        run: make check-install

  lite:
    name: tblog-lite / test + test-asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make -C lite test
        run: make -C lite test

      - name: make -C lite test-asan
        run: make -C lite test-asan
