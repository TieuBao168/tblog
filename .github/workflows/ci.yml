name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Changes to Markdown files and docs/ alone do not trigger CI (paths-ignore);
# log.conf, the workflow itself and every other file do.
#
# Linux: the library is built and tested by cmake-linux (gcc / clang,
# C++11/17, sanitizers, no zlib), alpine (musl), install, make and lite;
# cmake-linux also compiles tests/header_check via TBLOG_BUILD_TESTS=ON.
# Windows: cmake-windows builds the static library and the DLL, the tests,
# the examples, the DLL export check (packaging/check-exports.ps1) and, for
# MSVC, installs and builds packaging/consumer with find_package and with
# add_subdirectory: MSVC x64 (Release without zlib, Debug with vcpkg's zlib)
# and MinGW-w64 (MSYS2).
# macOS: cmake-macos builds the static library and the dylib with AppleClang,
# the tests, the examples, the bench and the Mach-O export check
# (packaging/check-symbols.sh) on arm64 (Release + -Werror, ASan+UBSan, TSan)
# and x86_64 (Release, C++11, no zlib); the arm64 Release entry also installs and
# builds against the installed tree (pkg-config via check-install.sh, and
# packaging/consumer with find_package, checking @rpath/libtblog.0.dylib).
# The `headers` job compiles only the public headers
# (TBLOG_HEADERS_ONLY_CHECK=ON) where the library is not built: MSVC ARM64
# (cross-compiled, compile only).
#
# Coverage guards, in every CMake job that runs the tests:
#   * packaging/check-test-inventory.cmake: the registered CTest tests must be
#     exactly tests/unit/*.cpp + tests/shared/*.cpp + the examples + the
#     checks that configuration calls for (a test cannot drop out unnoticed).
#   * packaging/report-skips.sh: lists every skipped test case (also in the
#     job summary). Linux jobs set TBLOG_TEST_NO_SKIP=1, which makes a skip a
#     failure (tests/tiny_test.h): on Linux every test must really run.
#   * lite/Makefile: `make -C lite test` fails if a lite/tests/test_*.c is not
#     built and run by it.

jobs:
  # No OS headers / OS calls outside src/platform/ (the platform layer).
  platform-boundary:
    name: platform boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: packaging/check-platform-boundary.sh
        run: sh packaging/check-platform-boundary.sh src

  cmake-linux:
    name: cmake / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc / C++17 / RelWithDebInfo
            cc: gcc
            cxx: g++
            std: 17
            options: ''
          - name: gcc / C++11
            cc: gcc
            cxx: g++
            std: 11
            options: ''
          - name: clang / C++17
            cc: clang
            cxx: clang++
            std: 17
            options: ''
          - name: gcc / ASan+UBSan
            cc: gcc
            cxx: g++
            std: 17
            options: -DTBLOG_SANITIZE=address,undefined
          - name: gcc / TSan
            cc: gcc
            cxx: g++
            std: 17
            options: -DTBLOG_SANITIZE=thread
          - name: gcc / no zlib
            cc: gcc
            cxx: g++
            std: 17
            options: -DTBLOG_WITH_ZLIB=OFF
    env:
      UBSAN_OPTIONS: print_stacktrace=1
      TBLOG_TEST_NO_SKIP: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev clang

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DTBLOG_CXX_STANDARD=${{ matrix.std }}
          -DTBLOG_BUILD_TESTS=ON
          -DTBLOG_BUILD_EXAMPLES=ON
          -DTBLOG_BUILD_BENCH=ON
          -DTBLOG_WERROR=ON
          ${{ matrix.options }}

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Test inventory
        run: cmake -DBUILD_DIR=build -P packaging/check-test-inventory.cmake

      - name: Skipped tests
        if: always()
        run: sh packaging/report-skips.sh build

  # Windows: static library + DLL, every test (tests/unit against the static
  # library, tests/shared against the DLL), the examples (as CTest smoke
  # tests, against the DLL) and check_exports (the DLL exports exactly the
  # TBLOG_API functions). The header check (tests/header_check) is compiled
  # at CMAKE_CXX_STANDARD, independently of the library's TBLOG_CXX_STANDARD.
  cmake-windows:
    name: cmake-windows / ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc x64 / Release / no zlib / install
            kind: msvc
            shell: pwsh
            config: Release
            options: -DTBLOG_WITH_ZLIB=OFF
            vcpkg: false
            install: true
          - name: msvc x64 / Debug / C++14 / zlib (vcpkg) / Werror
            kind: msvc
            shell: pwsh
            config: Debug
            options: -DTBLOG_WERROR=ON -DTBLOG_CXX_STANDARD=14 -DCMAKE_CXX_STANDARD=20
            vcpkg: true
            install: false
          - name: mingw-w64 gcc / Release / C++11 / zlib / Werror
            kind: mingw
            shell: msys2 {0}
            config: Release
            options: -DTBLOG_WERROR=ON -DTBLOG_CXX_STANDARD=11 -DCMAKE_CXX_STANDARD=20
            vcpkg: false
            install: false
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 MinGW-w64 toolchain
        if: matrix.kind == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib

      # Classic mode with the runner's preinstalled vcpkg.
      - name: Install zlib (vcpkg)
        if: matrix.vcpkg
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows'

      - name: Configure (MSVC)
        if: matrix.kind == 'msvc'
        run: |
          $extra = @()
          if ('${{ matrix.vcpkg }}' -eq 'true') {
            $extra += "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            $extra += "-DVCPKG_TARGET_TRIPLET=x64-windows"
          }
          cmake -S . -B build -A x64 -DTBLOG_BUILD_TESTS=ON -DTBLOG_BUILD_EXAMPLES=ON `
            -DTBLOG_BUILD_BENCH=ON ${{ matrix.options }} @extra | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.vcpkg }}' -eq 'true' -and
              -not (Select-String -Quiet -Path configure.log -Pattern '\(zlib\): ON')) {
            Write-Error "zlib from vcpkg was not found"; exit 1
          }

      - name: Configure (MinGW)
        if: matrix.kind == 'mingw'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DTBLOG_BUILD_TESTS=ON -DTBLOG_BUILD_EXAMPLES=ON -DTBLOG_BUILD_BENCH=ON
          ${{ matrix.options }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Skipped tests
        if: always()
        shell: bash
        run: sh packaging/report-skips.sh build

      # Also part of the Test step; run on its own so its output is in the log.
      - name: DLL export check
        run: ctest --test-dir build -C ${{ matrix.config }} -R check_exports -V

      - name: Test inventory
        run: cmake -DBUILD_DIR=build -DCONFIG=${{ matrix.config }} -P packaging/check-test-inventory.cmake

      # find_package(tblog 0.1) from a separate CMake project against the
      # installed tree: tblog::tblog (the DLL), tblog::tblog_static, cpp_api.
      - name: Install + find_package consumer (packaging/consumer)
        if: matrix.install
        run: |
          $prefix = "$env:RUNNER_TEMP/tblog"
          cmake --install build --config ${{ matrix.config }} --prefix $prefix
          if (-not (Test-Path "$prefix/lib/tblog_static.lib") -or -not (Test-Path "$prefix/lib/tblog.lib") -or
              -not (Test-Path "$prefix/bin/tblog.dll")) {
            Get-ChildItem -Recurse $prefix | Select-Object FullName; Write-Error "unexpected install layout"; exit 1
          }
          cmake -S packaging/consumer -B build-consumer -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-consumer --config ${{ matrix.config }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location build-consumer/${{ matrix.config }}
          function Run-Basic($exe) {
            Set-Content -Encoding ascii -Path "$exe.conf" -Value "file.path = $PWD/$exe.log`nreload.watch = false"
            & "./$exe.exe" "$exe.conf"
            if ($LASTEXITCODE -ne 0) { Write-Error "$exe exited with $LASTEXITCODE"; exit 1 }
            if (-not (Select-String -Quiet -Path "$exe.log" -Pattern 'started, pid-independent message hello')) {
              Write-Error "$exe.log: start line missing"; exit 1
            }
            $n = @(Select-String -Path "$exe.log" -Pattern 'worker . step').Count
            if ($n -ne 4000) { Write-Error "$exe.log: $n worker lines, expected 4000"; exit 1 }
          }
          Run-Basic basic_static              # needs no tblog.dll (not on PATH yet)
          $env:PATH = "$prefix/bin;$env:PATH"
          Run-Basic basic_default             # tblog::tblog -> tblog.dll
          Set-Content -Encoding ascii -Path cpp_api.conf -Value "file.path = $PWD/cpp_api.log`nreload.watch = false"
          ./cpp_api.exe cpp_api.conf 1000
          if ($LASTEXITCODE -ne 0) { Write-Error "cpp_api exited with $LASTEXITCODE"; exit 1 }
          if (-not (Select-String -Quiet -Path cpp_api.log -Pattern 'user 42 logged in from 10.0.0.7:8443')) {
            Write-Error "cpp_api.log: line missing"; exit 1
          }

      # The source tree as a subdirectory of packaging/consumer (no install):
      # tblog.dll lands in the consumer's CMAKE_RUNTIME_OUTPUT_DIRECTORY.
      - name: add_subdirectory consumer (packaging/consumer)
        if: matrix.install
        run: |
          cmake -S packaging/consumer -B build-subdir -A x64 "-DTBLOG_SOURCE_DIR=$PWD" -DTBLOG_WITH_ZLIB=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-subdir --config ${{ matrix.config }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location build-subdir/bin/${{ matrix.config }}
          if (-not (Test-Path tblog.dll)) { Get-ChildItem; Write-Error "tblog.dll not next to the executables"; exit 1 }
          foreach ($exe in @('basic_default', 'basic_static')) {
            Set-Content -Encoding ascii -Path "$exe.conf" -Value "file.path = $PWD/$exe.log`nreload.watch = false"
            & "./$exe.exe" "$exe.conf"
            if ($LASTEXITCODE -ne 0) { Write-Error "$exe exited with $LASTEXITCODE"; exit 1 }
            $n = @(Select-String -Path "$exe.log" -Pattern 'worker . step').Count
            if ($n -ne 4000) { Write-Error "$exe.log: $n worker lines, expected 4000"; exit 1 }
          }
          Set-Content -Encoding ascii -Path cpp_api.conf -Value "file.path = $PWD/cpp_api.log`nreload.watch = false"
          ./cpp_api.exe cpp_api.conf 1000
          if ($LASTEXITCODE -ne 0) { Write-Error "cpp_api exited with $LASTEXITCODE"; exit 1 }
          if (-not (Select-String -Quiet -Path cpp_api.log -Pattern 'user 42 logged in from 10.0.0.7:8443')) {
            Write-Error "cpp_api.log: line missing"; exit 1
          }

  # macOS (AppleClang): static library + dylib, every test (tests/unit against
  # the static library, tests/shared against the dylib), the examples (CTest
  # smoke tests, against the dylib), check_symbols (the dylib exports exactly
  # the tblog_* functions; not in sanitizer builds) and the bench (build
  # only). zlib from the SDK, except in the no-zlib entry.
  # x86_64: macos-15-intel (the macos-13 image was retired in December 2025).
  cmake-macos:
    name: cmake-macos / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64 / Release / Werror / install
            os: macos-latest
            config: Release
            options: -DTBLOG_WERROR=ON
            zlib: true
            install: true
          - name: arm64 / ASan+UBSan
            os: macos-latest
            config: RelWithDebInfo
            options: -DTBLOG_SANITIZE=address,undefined
            zlib: true
            install: false
          - name: arm64 / TSan
            os: macos-latest
            config: RelWithDebInfo
            options: -DTBLOG_SANITIZE=thread
            zlib: true
            install: false
          # C++11 library; public-header check (tests/header_check) at C++20.
          - name: x86_64 / Release / C++11 / no zlib
            os: macos-15-intel
            config: Release
            options: -DTBLOG_WITH_ZLIB=OFF -DTBLOG_CXX_STANDARD=11 -DCMAKE_CXX_STANDARD=20
            zlib: false
            install: false
    env:
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/tblog" -DCMAKE_INSTALL_LIBDIR=lib \
            -DTBLOG_BUILD_TESTS=ON -DTBLOG_BUILD_EXAMPLES=ON -DTBLOG_BUILD_BENCH=ON \
            ${{ matrix.options }} | tee configure.log
          if [ "${{ matrix.zlib }}" = true ] && ! grep -q '(zlib): ON' configure.log; then
            echo "zlib from the macOS SDK was not found"; exit 1
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Test inventory
        run: cmake -DBUILD_DIR=build -P packaging/check-test-inventory.cmake

      - name: Skipped tests
        if: always()
        run: sh packaging/report-skips.sh build

      # examples/basic.c against the installed tree via pkg-config (or the
      # script's built-in .pc reader), static and shared (-rpath).
      - name: Install + pkg-config consumer (packaging/check-install.sh)
        if: matrix.install
        env:
          BUILD: build
          CC: cc
          CFLAGS: -O2 -std=c99 -Wall -Wextra -Werror -pthread
          LDFLAGS: -pthread
        run: |
          cmake --install build
          ls -l "$RUNNER_TEMP/tblog/lib"
          TBLOG_INSTALLED_PREFIX="$RUNNER_TEMP/tblog" sh packaging/check-install.sh

      # find_package(tblog 0.1) from a separate CMake project. The shared
      # consumers must load @rpath/libtblog.0.dylib through the LC_RPATH CMake
      # gives them (no DYLD_LIBRARY_PATH).
      - name: find_package consumer (packaging/consumer)
        if: matrix.install
        run: |
          PREFIX="$RUNNER_TEMP/tblog"
          cmake -S packaging/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX"
          cmake --build build-consumer
          cd build-consumer
          unset DYLD_LIBRARY_PATH
          # (to files, then grep: no early-exit grep -q under pipefail)
          for exe in basic_default cpp_api; do
            otool -L "$exe" > "$exe.libs"; cat "$exe.libs"
            grep -q '@rpath/libtblog\.0\.dylib' "$exe.libs"
            otool -l "$exe" > "$exe.loads"
            grep -A2 LC_RPATH "$exe.loads" > "$exe.rpaths"; cat "$exe.rpaths"
            grep -q "path $PREFIX/lib " "$exe.rpaths"
          done
          otool -L basic_static > basic_static.libs
          if tail -n +2 basic_static.libs | grep libtblog; then
            echo "basic_static depends on libtblog.dylib"; exit 1
          fi
          for exe in basic_default basic_static; do
            printf 'file.path = %s\nreload.watch = false\n' "$PWD/$exe.log" > "$exe.conf"
            "./$exe" "$exe.conf"
            grep -q 'started, pid-independent message hello' "$exe.log"
            n=$(grep -c 'worker . step' "$exe.log")
            test "$n" -eq 4000
          done
          printf 'file.path = %s\nreload.watch = false\n' "$PWD/cpp_api.log" > cpp_api.conf
          ./cpp_api cpp_api.conf 1000
          grep -q 'user 42 logged in from 10.0.0.7:8443' cpp_api.log

  # Public headers only (tests/header_check, plain and with TBLOG_DLL): strict
  # warnings as errors (/W4 /WX /permissive-), where the library itself is
  # not built: MSVC ARM64.
  headers:
    name: headers / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-compiled, compile only: covers the ARM64 atomics in log.h.
          - name: msvc arm64 / C++17
            os: windows-latest
            kind: msvc
            shell: pwsh
            generator: -A ARM64
            std: 17
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # C++: CMAKE_CXX_STANDARD; C: C99 (C11 on MSVC), set in CMakeLists.txt.
      - name: Configure
        run: >
          cmake -S . -B build ${{ matrix.generator }}
          -DTBLOG_HEADERS_ONLY_CHECK=ON
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}

      - name: Build
        run: cmake --build build --config Release --verbose

  install:
    name: install / pkg-config + find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev pkg-config

      - name: Build and install
        run: |
          PREFIX="$RUNNER_TEMP/tblog"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib -DTBLOG_WERROR=ON
          cmake --build build
          cmake --install build

      # examples/basic.c against the installed tree via pkg-config, static and shared.
      - name: pkg-config consumer (packaging/check-install.sh)
        env:
          TBLOG_INSTALLED_PREFIX: ${{ runner.temp }}/tblog
          BUILD: build
          CC: gcc
          CFLAGS: -O2 -std=c99 -Wall -Wextra -Werror -pthread
          LDFLAGS: -pthread
        run: sh packaging/check-install.sh

      # find_package(tblog 0.1) + tblog::tblog from a separate CMake project.
      - name: find_package consumer (packaging/consumer)
        run: |
          PREFIX="$RUNNER_TEMP/tblog"
          cmake -S packaging/consumer -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH="$PREFIX"
          cmake --build build-consumer
          export LD_LIBRARY_PATH="$PREFIX/lib"
          cd build-consumer
          for exe in basic_default basic_static; do
            printf 'file.path = %s\nreload.watch = false\n' "$PWD/$exe.log" > "$exe.conf"
            "./$exe" "$exe.conf"
            grep -q 'started, pid-independent message hello' "$exe.log"
            n=$(grep -c 'worker . step' "$exe.log")
            test "$n" -eq 4000
          done
          readelf -d basic_default > basic_default.dyn
          grep -q 'NEEDED.*\[libtblog\.so\.0\]' basic_default.dyn
          readelf -d basic_static > basic_static.dyn
          if grep -q 'NEEDED.*libtblog' basic_static.dyn; then
            echo "basic_static depends on libtblog.so"; exit 1
          fi
          printf 'file.path = %s\nreload.watch = false\n' "$PWD/cpp_api.log" > cpp_api.conf
          ./cpp_api cpp_api.conf 1000
          grep -q 'user 42 logged in from 10.0.0.7:8443' cpp_api.log

      # The source tree as a subdirectory of packaging/consumer (no install),
      # what add_subdirectory / FetchContent users get.
      - name: add_subdirectory consumer (packaging/consumer)
        run: |
          cmake -S packaging/consumer -B build-subdir -G Ninja -DTBLOG_SOURCE_DIR="$PWD"
          cmake --build build-subdir
          cd build-subdir/bin
          for exe in basic_default basic_static; do
            printf 'file.path = %s\nreload.watch = false\n' "$PWD/$exe.log" > "$exe.conf"
            "./$exe" "$exe.conf"
            n=$(grep -c 'worker . step' "$exe.log")
            test "$n" -eq 4000
          done
          printf 'file.path = %s\nreload.watch = false\n' "$PWD/cpp_api.log" > cpp_api.conf
          ./cpp_api cpp_api.conf 1000
          grep -q 'user 42 logged in from 10.0.0.7:8443' cpp_api.log

  # Linux with musl libc (Alpine container): the whole CTest suite, including
  # the crash tests without <execinfo.h> (no stack dump on musl).
  alpine:
    name: alpine (musl) / gcc / C++17 / Werror
    runs-on: ubuntu-latest
    container: alpine:3.20
    env:
      TBLOG_TEST_NO_SKIP: '1'
    steps:
      - name: Install packages
        run: apk add --no-cache build-base cmake ninja zlib-dev linux-headers git

      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTBLOG_BUILD_TESTS=ON -DTBLOG_BUILD_EXAMPLES=ON -DTBLOG_BUILD_BENCH=ON
          -DTBLOG_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Test inventory
        run: cmake -DBUILD_DIR=build -P packaging/check-test-inventory.cmake

      - name: Skipped tests
        if: always()
        run: sh packaging/report-skips.sh build

  make:
    name: make / test + check-symbols + check-install
    runs-on: ubuntu-latest
    env:
      TBLOG_TEST_NO_SKIP: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev pkg-config

      - name: make test
        run: make -j"$(nproc)" test

      - name: make check-symbols
        run: make check-symbols

      - name: make check-install
        run: make check-install

  lite:
    name: tblog-lite / test + test-asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make -C lite test
        run: make -C lite test

      - name: make -C lite test-asan
        run: make -C lite test-asan

      # The host demo (the same application code as with full tblog) and the
      # footprint report (host -Os; Cortex-M only if arm-none-eabi-gcc exists).
      - name: make -C lite demo size
        run: make -C lite demo size
