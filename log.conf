# tblog configuration — `key = value`, '#' starts a comment.
level              = INFO          # TRACE|DEBUG|INFO|WARN|ERROR|FATAL|OFF
pattern            = %D %T.%us [%L] [%t] %f:%l - %m

file.path          = ./logs/app.log
file.max_size      = 256MB
file.max_files     = 5             # live file + up to 4 rotated ones
file.rotate        = size          # size | daily | hourly (local time; max_size still caps)
file.compress      = none          # none | gzip (rotated files, background thread; needs zlib)

buffer.size        = 4MB           # size of each buffer A/B
full_policy        = drop          # drop | block

flush.interval_ms  = 200
sync.interval_ms   = 1000          # fdatasync period; bounds loss on power failure
sync.on_level      = ERROR         # fdatasync right away at this level

console            = false
console.color      = true
syslog             = false

module.network     = DEBUG
reload.watch       = true          # re-read this file when it changes
