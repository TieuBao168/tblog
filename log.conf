# tblog configuration — `key = value`, '#' starts a comment. Every key, its
# default and the hot-reload rules: docs/configuration.md. The values below
# are the defaults, except module.network.
level              = INFO          # TRACE|DEBUG|INFO|WARN|ERROR|FATAL|OFF
pattern            = %D %T.%us [%L] [%t] %f:%l - %m

file               = true          # false: no log file (console / syslog / tblog_add_sink only)
file.path          = ./logs/app.log
file.max_size      = 256MB         # B/KB/MB/GB
file.max_files     = 5             # live file + up to 4 rotated ones
file.rotate        = size          # size | daily | hourly (local time; max_size still caps)
file.compress      = none          # none | gzip (rotated files, background thread; needs zlib)

buffer.size        = 4MB           # per buffer A/B, split across the shards (RAM: 2x)
full_policy        = drop          # drop (count and drop, never wait) | block

flush.interval_ms  = 200           # 1..60000
sync.interval_ms   = 1000          # 0..3600000, 0 = no periodic sync; bounds loss on power failure
sync.on_level      = ERROR         # sync right away at this level and above

console            = false         # also write to stderr
console.color      = true          # colours when stderr is a terminal
syslog             = false         # Linux, macOS (ignored with a warning on Windows)

module.network     = DEBUG
reload.watch       = true          # re-read this file when it changes
