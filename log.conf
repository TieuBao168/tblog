# tblog configuration — `key = value`, '#' after a space starts a comment.
# Every key with its default below (except module.network); the reference for
# each key, its trade-offs and ready-made recipes: docs/configuration.md.

# ---- levels and modules (hot-reload)
level              = INFO          # TRACE|DEBUG|INFO|WARN|ERROR|FATAL|OFF (root module)
module.network     = DEBUG         # per-module level (example; no module has one by default)

# ---- line format (hot-reload); the value is the whole rest of the line
pattern            = %D %T.%us [%L] [%t] %f:%l - %m

# ---- file, rotation, compression (restart)
file               = true          # false: no log file (console / syslog / tblog_add_sink only)
file.path          = ./logs/app.log  # relative to the working directory; parent dirs are created
file.max_size      = 256MB         # B/KB/MB/GB; rotate before a line would exceed it
file.max_files     = 5             # live file + up to 4 rotated ones (.gz included)
file.rotate        = size          # size | daily | hourly (local time; max_size still caps)
file.compress      = none          # none | gzip (rotated files, background thread; needs zlib)

# ---- buffer (restart)
buffer.size        = 4MB           # per buffer A/B, split across the shards (RAM: 2x, >= 64KB per shard)
full_policy        = block         # block: caller waits for room, nothing lost | drop: count and drop, never wait

# ---- writing and durability
flush.interval_ms  = 200           # 1..60000; max time between two writes of the worker (hot-reload)
flush.on_level     = OFF           # at this level and above the call returns once the line is written
                                   # to the file (survives kill -9; waits at most 2 s) (hot-reload)
sync.interval_ms   = 1000          # 0..3600000, 0 = no periodic fsync; bounds loss on power failure (hot-reload)
sync.on_level      = ERROR         # wake the worker + fsync right after, without waiting (restart)

# ---- other sinks (restart)
console            = false         # also write to stderr
console.color      = true          # colours when stderr is a terminal
syslog             = false         # Linux, macOS (ignored with a warning on Windows)

# ---- hot-reload (restart)
reload.watch       = true          # re-read this file when it changes (checked about once a second)
